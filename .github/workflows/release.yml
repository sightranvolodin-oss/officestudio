# Builds the Windows installer + portable on GitHub's Windows machines and publishes them as a
# GitHub Release (tag v<version from package.json>). The app's «Обновить» button reads these
# releases: latest.yml + installer for the installed copy, the portable .exe for the portable one.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # the embedded editors (WordCraft, GridCraft, DeckCraft, CADCraft): scripts/build-crafts.sh
  crafts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .crafts-work/deckcraft-* -> target
          cache-on-failure: true
      - uses: storytold/craft-common-actions/actions/install-trunk@main
      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_TERM_COLOR: never
        run: scripts/build-crafts.sh "$PWD/crafts" 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Report failure
        if: failure()
        run: |
          (grep -n -B2 -A14 -E '^error|error\[' build.log | head -150; tail -n 15 build.log) | sed 's/^/::error::/'; true
      - uses: actions/upload-artifact@v4
        with:
          name: crafts
          path: crafts
          include-hidden-files: true
          if-no-files-found: error
  windows:
    needs: crafts
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: crafts
          path: crafts
      - name: Check the embedded editors
        run: for a in wordcraft gridcraft deckcraft cadcraft; do test -f crafts/$a/index.html || { echo "::error::crafts/$a missing"; exit 1; }; done
      - name: Build
        run: npx electron-builder --win nsis portable --x64 --publish never 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          ls -la dist
          if ! gh release view "v$VER" >/dev/null 2>&1; then
            gh release create "v$VER" --title "OfficeStudio $VER" --notes-file release-notes.md --target "$GITHUB_SHA"
          else
            gh release edit "v$VER" --title "OfficeStudio $VER" --notes-file release-notes.md
          fi
          gh release upload "v$VER" "dist/OfficeStudio-Setup-$VER.exe" "dist/OfficeStudio-Setup-$VER.exe.blockmap" "dist/OfficeStudio-Portable-$VER.exe" dist/latest.yml --clobber 2>&1 | tee upload.log
      - name: Report failure
        if: failure()
        run: |
          for f in build.log upload.log; do [ -f $f ] && tail -n 25 $f | sed 's/^/::error::/' ; done; true
