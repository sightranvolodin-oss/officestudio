# Builds the embedded editors (scripts/build-crafts.sh) and stores them on the «crafts» branch,
# so they can be checked outside of a release.
name: Build Craft editors
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crafts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .crafts-work/deckcraft-* -> target
          cache-on-failure: true
      - uses: storytold/craft-common-actions/actions/install-trunk@main
      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_TERM_COLOR: never
        run: scripts/build-crafts.sh "$PWD/out" 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Report failure
        if: failure()
        run: (grep -n -B2 -A14 -E '^(error|warning: unused)|error\[' build.log | head -150; tail -n 15 build.log) | sed 's/^/::error::/'; true
      - name: Push to the crafts branch
        run: |
          set -e
          cd out
          git init -q -b crafts
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Craft editors $(cat */VERSION | tr '\n' ' ')"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" crafts
