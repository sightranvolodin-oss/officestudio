<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'wasm-unsafe-eval'">
  <title>OfficeStudio</title>

</head>
<body>
  <div id="tabbar">

    <button id="update-btn" class="update-btn" hidden></button>
  </div>
  <div id="views"></div>
  <div id="drop-hint"><div>Отпустите, чтобы открыть файл</div></div>

  <script src="ui.js"></script>

  <script src="sheet-editor.js"></script>
